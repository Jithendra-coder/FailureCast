<text x="70" y="1030" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#607086" text-anchor="start" letter-spacing="0">The Compose configuration is single-host. Multi-host operation would need shared transactional storage, a distributed job queue, and shared artifacts.</text>
