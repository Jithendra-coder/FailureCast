<text x="1434" y="358" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#607086" text-anchor="start" letter-spacing="0">data/raw/&lt;version&gt;/</text>
<text x="1434" y="387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#607086" text-anchor="start" letter-spacing="0">Imported source bytes are preserved</text>
<text x="1434" y="416" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#607086" text-anchor="start" letter-spacing="0">SHA-256 fingerprints avoid duplicates</text>
<rect x="410" y="640" width="450" height="230" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/>
<rect x="410" y="640" width="7" height="230" rx="3.5" fill="#356AE6"/>
